#version: '3.8'
#Docker Compose file
networks:
  data-network:
    driver: bridge

services:

  # --- METADATA DATABASE
  postgres:
    image: postgres:15-alpine
    container_name: airflow-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASS}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-mlflow.sh:/docker-entrypoint-initdb.d/init-mlflow.sh:ro
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - data-network
    #command: >
    #  postgres -c max_connections=200 &
    #  until pg_isready -q; do sleep 1; done;
    #  psql -U "${AIRFLOW_DB_USER}" -d "${AIRFLOW_DB_NAME}" -c "CREATE DATABASE ${MLFLOW_DB_NAME};" || true;
    #  wait
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEM_LIMIT}

  # --- CONFLUENT PLATFORM 7.5 (KRaft Mode)
  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: kafka-confluent
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - data-network

  # --- SPARK RUNTIME
  spark-master:
    image: apache/spark:3.4.2
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8082:8080"
      - "7075:7077"
    networks:
      - data-network
    deploy:
      resources:
        limits:
          memory: 1000M

  spark-worker:
    image: apache/spark:3.4.2
    container_name: spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    networks:
      - data-network
    deploy:
      resources:
        limits:
          memory: 1500M

  # --- MLFLOW TRACKING SERVER 
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.8.1
    container_name: mlflow_server
    ports:
      - "${MLFLOW_PORT}:5000"
    volumes:
      - ./data:/mlflow/data
    depends_on:
      - postgres
    command: >
      bash -c "pip install --no-cache-dir psycopg2-binary && 
      mlflow server 
      --host 0.0.0.0 
      --port 5000 
      --backend-store-uri postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASS}@postgres:5432/${MLFLOW_DB_NAME} 
      --default-artifact-root ${DEFAULT_ARTIFACT_ROOT}"
    networks:
      - data-network
    deploy:
      resources:
        limits:
          memory: ${MLFLOW_MEM_LIMIT}

  # --- APACHE AIRFLOW CORE
  airflow-init:
    build: .
    container_name: airflow-init
    env_file:
      - .env
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASS}@postgres:5432/${AIRFLOW_DB_NAME}
      - AIRFLOW_CONN_WSL_HOST_SSH=ssh://rajesh:admin123@host.docker.internal:22
      - _AIRFLOW_DB_MIGRATE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin123
    #  - INIT_ADMIN_USER=${AIRFLOW_ADMIN_USER}
    #  - INIT_ADMIN_PASS=${AIRFLOW_ADMIN_PASSWORD}
    #  - INIT_ADMIN_EMAIL=${AIRFLOW_ADMIN_EMAIL}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./plugins:/opt/airflow/plugins
      - ./airflow.cfg:/opt/airflow/airflow.cfg
    #command: bash -c "echo 'Checking DB...'; if ! airflow users list &>/dev/null; then echo 'First time setup...'; airflow db migrate && airflow users create --username \"$$INIT_ADMIN_USER\" --firstname Admin --lastname User --role Admin --email \"$$INIT_ADMIN_EMAIL\" --password \"$$INIT_ADMIN_PASS\"; else echo 'DB already running. Skipping.'; fi"
    command: bash -c "airflow db migrate && airflow users create --username \"$$AIRFLOW_ADMIN_USER\" --firstname Admin --lastname User --role Admin --email \"$$AIRFLOW_ADMIN_EMAIL\" --password \"$$AIRFLOW_ADMIN_PASSWORD\""
    networks:
      - data-network

  airflow-webserver:
    build: .
    container_name: airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "${AIRFLOW_WEBSERVER_PORT}:8080" 
    volumes:
      - ./dags:/opt/airflow/dags
      - ./plugins:/opt/airflow/plugins
      - ./airflow.cfg:/opt/airflow/airflow.cfg
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/opt/airflow/data
      - ./scripts:/opt/airflow/scripts
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASS}@postgres:5432/${AIRFLOW_DB_NAME}
      - AIRFLOW_CONN_WSL_HOST_SSH=ssh://${SSH_USER}:${SSH_PASS}@${SSH_HOST}:${SSH_PORT}
    command: webserver
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - data-network
    deploy:
      resources:
        limits:
          memory: ${AIRFLOW_WEBSERVER_MEM_LIMIT}

  airflow-scheduler:
    build: .
    container_name: airflow-scheduler
    depends_on:
      - airflow-webserver
    volumes:
      - ./dags:/opt/airflow/dags
      - ./plugins:/opt/airflow/plugins
      - ./airflow.cfg:/opt/airflow/airflow.cfg
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/opt/airflow/data
      - ./scripts:/opt/airflow/scripts
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASS}@postgres:5432/${AIRFLOW_DB_NAME}
      - AIRFLOW_CONN_WSL_HOST_SSH=ssh://rajesh:admin123@host.docker.internal:22
    command: scheduler
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - data-network
    deploy:
      resources:
        limits:
          memory: ${AIRFLOW_SCHEDULER_MEM_LIMIT}

volumes:
  postgres_data:
